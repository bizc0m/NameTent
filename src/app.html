.logo-thumbnails{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:10px 0 14px}.logo-thumb{background:var(--control);border:1px solid var(--line);border-radius:6px;padding:8px;min-width:0}.logo-thumb-image{height:48px;display:flex;align-items:center;justify-content:center;background:#fff;border-radius:3px;color:#7b818b;margin-bottom:6px}.logo-thumb-image img{max-width:100%;max-height:48px;object-fit:contain}.logo-thumb strong,.logo-thumb span{display:block;font-size:10px;line-height:1.4}.logo-thumb span{color:var(--muted);margin-top:2px}

/* Shared dimensions for actions and file-picker labels. */
button,.button-file{box-sizing:border-box;min-height:32px;padding:7px 10px;font-size:12px;line-height:1.2;font-weight:550;border-radius:5px;vertical-align:middle;gap:6px}
.file-upload{display:flex;align-items:stretch;margin:8px 0}.file-upload .button-file{display:flex;align-items:center;margin:0;min-height:32px;padding:7px 10px;font-size:12px;line-height:1.2}
.list-transfers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:1fr;gap:8px;align-items:stretch;padding-top:10px}
.list-transfers>button,.list-transfers>.file-upload{width:100%;min-width:0;margin:0}
.list-transfers>button,.list-transfers>.file-upload>.button-file{display:flex;align-items:center;justify-content:flex-start;min-height:36px;height:100%;margin:0;padding:8px;font-size:12px;line-height:1.25;white-space:normal;text-align:left;overflow-wrap:anywhere}
.list-transfers>.file-upload>.button-file{width:100%;border-radius:5px;box-shadow:0 1px 2px #00000012}
.list-transfers .ui-icon{width:16px;height:16px;flex:0 0 16px}.list-transfers button span,.list-transfers .button-file span{min-width:0}
.participant-actions button{min-height:32px}.export-actions>.button-file{margin:0;align-self:stretch}
header>div:first-child .mode-switch{margin-top:8px;width:max-content}
header .export-actions button[data-action="pdf"]{background:#15803d;color:#fff;border-color:#15803d}
header .export-actions button[data-action="pdf"]:hover{background:#166534}

let depth=0;const filesDrag=e=>Array.from(e.dataTransfer?.types||[]).includes('Files');function clearDrop(){depth=0;document.body.classList.remove('dropping')}document.addEventListener('dragenter',e=>{if(filesDrag(e)){e.preventDefault();if(!busy&&!document.querySelector('dialog[open]')){depth++;document.body.classList.add('dropping')}}});document.addEventListener('dragover',e=>{if(filesDrag(e)){e.preventDefault();e.dataTransfer.dropEffect=busy?'none':'copy'}});document.addEventListener('dragleave',e=>{if(filesDrag(e)){depth=Math.max(0,depth-1);if(!depth)clearDrop()}});document.addEventListener('drop',e=>{e.preventDefault();clearDrop();if(busy||document.querySelector('dialog[open]'))return;const file=e.dataTransfer.files[0];if(!file)return;if(/\.zip$/i.test(file.name)){task(()=>restoreProject(file));return}if(/\.csv$/i.test(file.name)){task(()=>openCsv(file));return}const f=e.target.closest?.('.face'),logoEl=e.target.closest?.('.logo');let point=null,index=logoEl?+logoEl.dataset.logo:selected?.kind==='logo'?selected.key:0;if(f){activateFace(f);if(index<2)logoScope='person';const r=f.getBoundingClientRect();point={x:(e.clientX-r.left)/r.width*297,y:(e.clientY-r.top)/r.height*105};if(f.dataset.side==='top')point={x:297-point.x,y:105-point.y}}task(()=>importLogo(file,index,point))});window.addEventListener('blur',clearDrop);document.addEventListener('keydown',e=>{if(busy){e.preventDefault();e.stopImmediatePropagation()}if(e.key==='Escape')hideTip()},true);


function activateFace(face){const index=Number(face.dataset.person);if(Number.isInteger(index)&&index!==active){active=index;selected=null;syncParticipantSelect();selectionUI();syncParticipantPanel();}}
function syncParticipantsText(){const el=$('participantsText');if(el&&document.activeElement!==el)el.value=persons.map(p=>p.name+(p.sub?', '+p.sub:'')).join('\n');}
function parseParticipantsText(text){return text.split(/\r?\n/).filter(line=>line.trim()).map(line=>{const index=line.includes('|')?line.indexOf('|'):line.indexOf(',');return{name:(index<0?line:line.slice(0,index)).trim(),sub:index<0?'':line.slice(index+1).trim()}})}
function applyParticipantsText(el){try{const rows=parseParticipantsText(el.value);validateRows(rows);persons=preserveParticipantMetadata(rows);active=Math.max(0,Math.min(active,rows.length-1));selected=null;dirty=true;syncParticipantSelect();selectionUI();$('participantsError').textContent='';renderPreview()}catch(err){$('participantsError').textContent=err.message;}}

function selectParticipant(index,scroll=true){if(!persons.length)return;flush();active=Math.max(0,Math.min(persons.length-1,index));selected={kind:'block',key:'name',face:'bottom'};if($('activePerson'))$('activePerson').value=active;selectionUI();paint();if(scroll)$('pages').querySelector('[data-person="'+active+'"]')?.scrollIntoView?.({block:'nearest',behavior:'auto'});}
function selectParticipantFromText(el){const before=el.value.slice(0,el.selectionStart??0).split(/\r?\n/);const line=before.length-1,all=el.value.split(/\r?\n/);if(!all[line]?.trim())return;const index=all.slice(0,line).filter(v=>v.trim()).length;selectParticipant(index);}
document.addEventListener('click',e=>{if(e.target.id==='participantsText')selectParticipantFromText(e.target);const target=e.target.closest?.('.textblock');if(target&&!busy){activateFace(target.closest('.face'));selectElement('block',target.dataset.block,target.closest('.face').dataset.side);paint();}});

function updatePreviewZoom(){const sheet=$('pages').querySelector('.sheet');if(!sheet)return;const preview=document.querySelector('.preview'),style=getComputedStyle(preview),available=Math.max(1,preview.clientWidth-parseFloat(style.paddingLeft)-parseFloat(style.paddingRight)-8);const natural=sheet.offsetWidth;if(!natural)return;const ratio=previewFit?Math.min(1,available/natural):previewPercent/100;$('pages').querySelectorAll('.sheet').forEach(page=>page.style.zoom=ratio);$('previewZoom').value=Math.round(ratio*100);$('zoomValue').textContent=Math.round(ratio*100)+' %';$('fitPreview').setAttribute('aria-pressed',String(previewFit));}
